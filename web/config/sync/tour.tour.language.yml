_core:
  default_config_hash: qYkmRoScIjpvKrNO8DCi6lscVGakJCBZMp7ytg5OerM
id: language
label: Language
module: language
routes:
  -
    route_name: entity.configurable_language.collection
tips:
  language-overview:
    id: language-overview
    plugin: text
    label: Languages
    body: '<p>The "Languages" page allows you to add, edit, delete, and reorder languages for the site.</p>'
    weight: 1
  language-add:
    id: language-add
    plugin: text
    label: 'Adding languages'
    body: '<p>To add more languages to your site, click the "Add language" button.</p><p>Added languages will be displayed in the language list and can then be edited or deleted.</p>'
    weight: 2
    attributes:
      data-class: button-action
  language-reorder:
    id: language-reorder
    plugin: text
    label: 'Reordering languages'
    body: '<p>Para reordenar os idiomas em seu site, use os ícones de arrastar próximos de cada idioma.</p><p>A ordem exibida aqui é a ordem de exibição para as listas de idiomas no site, tais como nos blocos de alternância de idiomas fornecidos pelos módulos Interface Translation e Content Translation.</p><p>Quando você terminar de reordenar os idiomas, clique no botão "Salvar configuração" para que as mudanças sejam aplicadas.</p>'
    weight: 3
    attributes:
      data-class: draggable
  language-default:
    id: language-default
    plugin: text
    label: 'Set a language as default'
    body: '<p>You can change the default language of the site by choosing one of your configured languages as default. The site will use the default language in situations where no choice is made but a language should be set, for example as the language of the displayed interface.</p>'
    weight: 4
    attributes:
      data-class: js-form-item-site-default-language
  language-operations:
    id: language-operations
    plugin: text
    label: 'Modifying languages'
    body: '<p>São fornecidas operações para editar ou apagar seus idiomas.</p><p>Você pode editar o nome e direção do idioma.</p><p>Idiomas apagados podem ser adicionados novamente. Apagar um idioma remove todas as traduções de interface associadas à ele e o conteúdo neste idioma passará a ser definido como idioma neutro. Note que você não pode apagar o idioma padrão do site.</p>'
    weight: 5
    attributes:
      data-class: dropbutton-wrapper
  language-continue:
    id: language-continue
    plugin: text
    label: 'Continuing on'
    body: '<p>Agora que você tem uma visão geral da página de "Idiomas", você pode continuar:<ul><li><a href="[site:url]admin/config/regional/language/add">Adicionando um idioma</a></li><li>Reordenando idiomas</li><li>Editando um idioma</li><li>Apagando um idioma</li></ul></p>'
    weight: 6
