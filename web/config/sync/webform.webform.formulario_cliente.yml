elements: "markup:\n  '#type': webform_markup\n  '#markup': |\n    <h3>Favor preencher detalhes do evento</h3>\n    <hr>\n    \nnome_completo:\n  '#type': textfield\n  '#title': 'Nome Completo'\n  '#title_display': before\n  '#description_display': invisible\n  '#required': true\ndata_evento:\n  '#type': date\n  '#title': 'Data do Evento'\n  '#title_display': before\n  '#description_display': before\n  '#help_display': title_before\n  '#size': '60'\n  '#required': true\n  '#date_date_min': '[webform_submission:created:html_date]'\n  '#min': '[webform_submission:created:html_date]'\n  '#datepicker': true\n  '#datepicker_button': true\n  '#date_date_format': d/m/Y\nnumero_convidados:\n  '#type': number\n  '#title': 'Número de Convidados'\n  '#title_display': before\n  '#size': '60'\n  '#required': true\nlocal:\n  '#type': textarea\n  '#title': Local\n  '#description': |\n    <blockquote>\n    <p><em>Caso n&atilde;o tenha definido, informar regi&atilde;o pretendida para realiza&ccedil;&atilde;o do evento</em></p>\n    </blockquote>\n    \n  '#title_display': before\n  '#description_display': before\n  '#required': true\ntipo_evento:\n  '#type': radios\n  '#title': 'Tipo de Evento'\n  '#title_display': before\n  '#options':\n    bodas: Bodas\n    casamento: Casamento\n    corporativo: Corporativo\n    debutante: Debutante\n    festa_infantil: 'Festa Infantil'\n  '#required': true\ntipo_bodas:\n  '#type': textarea\n  '#title': 'Especifique o Tipo de Bodas a ser comemorado'\n  '#placeholder': 'Especifique o tipo de bodas a ser comemorado'\n  '#required': true\n  '#states':\n    visible:\n      ':input[name=\"tipo_evento\"]':\n        value: bodas\ntipo_casamento:\n  '#type': radios\n  '#title': 'Tipo de Casamento'\n  '#options':\n    hetero: Hetero\n    homoafetivo: Homoafetivo\n  '#required': true\n  '#states':\n    visible:\n      ':input[name=\"tipo_evento\"]':\n        value: casamento\ntipo_comemoracao:\n  '#type': textarea\n  '#title': 'Tipo de Comemoração'\n  '#title_display': none\n  '#placeholder': 'Especifique o tipo de comemoração a ser celebrada'\n  '#required': true\n  '#states':\n    visible:\n      ':input[name=\"tipo_evento\"]':\n        value: corporativo\nidade_crianca:\n  '#type': textfield\n  '#title': 'Idade da Criança'\n  '#title_display': invisible\n  '#placeholder': 'Idade da criança'\n  '#required': true\n  '#states':\n    visible:\n      ':input[name=\"tipo_evento\"]':\n        value: festa_infantil\nvalor_max_fotografia:\n  '#type': number\n  '#title': 'Valor que deseja investir em Fotografia'\n  '#description': '<em>Esse campo &eacute; opcional, o objetivo &eacute; que apenas os fot&oacute;grafos que se encontram dentro da margem de valor estipulada enviem propostas</em>'\n  '#title_display': before\n  '#description_display': before\n  '#placeholder': '00,00'\nobservacoes:\n  '#type': textarea\n  '#title': Observações\n  '#description': '<em>Informe nesse campo, de forma objetiva, outros detalhes que considere relevante sobre o evento&nbsp;</em>'\n  '#title_display': before\n  '#description_display': before\nemail:\n  '#type': hidden\n  '#title': Email\n  '#default_value': '[current-user:mail]'\nactions:\n  '#type': webform_actions\n  '#title': 'Submit button(s)'\n  '#submit__label': Enviar\n  '#submit__attributes':\n    class:\n      - 'btn btn-primary button button--primary js-form-submit form-submit'"
