    '#title': 'Número de Convidados'
    '#title_display': before
    '#size': '60'
    '#placeholder': '0'
    '#required': true
  local:
    '#type': textarea
    '#title': Local
    '#description': |
      <blockquote>
      <p><em>Caso n&atilde;o tenha definido, informar regi&atilde;o pretendida para realiza&ccedil;&atilde;o do evento</em></p>
      </blockquote>
    '#title_display': before
    '#description_display': before
    '#required': true
  tipo_evento:
    '#type': radios
    '#title': 'Tipo de Evento'
    '#title_display': before
    '#options':
      bodas: Bodas
      casamento: Casamento
      corporativo: Corporativo
      debutante: Debutante
      festa_infantil: 'Festa Infantil'
    '#required': true
  tipo_bodas:
    '#type': textarea
    '#title': 'Especifique o Tipo de Bodas a ser comemorado'
    '#placeholder': 'Especifique o tipo de bodas a ser comemorado'
    '#required': true
    '#states':
      visible:
        ':input[name="tipo_evento"]':
          value: bodas
  tipo_casamento:
    '#type': radios
    '#title': 'Tipo de Casamento'
    '#options':
      hetero: Hetero
      homoafetivo: Homoafetivo
    '#required': true
    '#states':
      visible:
        ':input[name="tipo_evento"]':
          value: casamento
  tipo_comemoracao:
    '#type': textarea
    '#title': 'Tipo de Comemoração'
    '#title_display': none
    '#placeholder': 'Especifique o tipo de comemoração a ser celebrada'
    '#required': true
    '#states':
      visible:
        ':input[name="tipo_evento"]':
          value: corporativo
  idade_crianca:
    '#type': textfield
    '#title': 'Idade da Criança'
    '#title_display': invisible
    '#placeholder': 'Idade da criança'
    '#required': true
    '#states':
      visible:
        ':input[name="tipo_evento"]':
          value: festa_infantil
  observacoes:
    '#type': textarea
    '#title': Observações
    '#description': '<em>Informe nesse campo, de forma objetiva, outros detalhes que considere relevante sobre o evento&nbsp;</em>'
