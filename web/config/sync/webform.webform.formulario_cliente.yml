elements: "markup:\n  '#type': webform_markup\n  '#markup': |\n    <h3>Favor preencher detalhes do evento</h3>\n    <hr>\nnome_completo:\n  '#type': textfield\n  '#title': 'Nome Completo'\n  '#title_display': none\n  '#description_display': invisible\n  '#placeholder': 'Nome Completo'\n  '#required': true\ndata_evento:\n  '#type': date\n  '#title': 'Data do Evento'\n  '#title_display': none\n  '#description_display': invisible\n  '#size': '60'\n  '#placeholder': 'Data do Evento'\n  '#required': true\n  '#date_date_min': '[webform_submission:created:html_date]'\n  '#datepicker': true\n  '#datepicker_button': true\n  '#date_date_format': d/m/Y\nnumero_convidados:\n  '#type': number\n  '#title': 'Número de Convidados'\n  '#title_display': none\n  '#size': '60'\n  '#placeholder': 'Número de Convidados'\n  '#required': true\nlocal:\n  '#type': textarea\n  '#title': Local\n  '#description': 'Caso n&atilde;o tenha definido, informar regi&atilde;o pretendida para realiza&ccedil;&atilde;o do evento'\n  '#title_display': none\n  '#placeholder': Local\n  '#required': true\ntipo_evento:\n  '#type': radios\n  '#title': 'Tipo de Evento'\n  '#title_display': before\n  '#options':\n    bodas: Bodas\n    casamento: Casamento\n    corporativo: Corporativo\n    debutante: Debutante\n    festa_infantil: 'Festa Infantil'\n  '#required': true\ntipo_bodas:\n  '#type': textarea\n  '#title': 'Especifique o Tipo de Bodas a ser comemorado'\n  '#placeholder': 'Especifique o tipo de bodas a ser comemorado'\n  '#required': true\n  '#states':\n    visible:\n      ':input[name=\"tipo_evento\"]':\n        value: bodas\ntipo_casamento:\n  '#type': radios\n  '#title': 'Tipo de Casamento'\n  '#options':\n    hetero: Hetero\n    homoafetivo: Homoafetivo\n  '#required': true\n  '#states':\n    visible:\n      ':input[name=\"tipo_evento\"]':\n        value: casamento\ntipo_comemoracao:\n  '#type': textarea\n  '#title': 'Tipo de Comemoração'\n  '#title_display': none\n  '#placeholder': 'Especifique o tipo de comemoração'\n  '#required': true\n  '#states':\n    visible:\n      ':input[name=\"tipo_evento\"]':\n        value: corporativo\nidade_crianca:\n  '#type': textfield\n  '#title': 'Idade da Criança'\n  '#title_display': invisible\n  '#placeholder': 'Idade da criança'\n  '#required': true\n  '#states':\n    visible:\n      ':input[name=\"tipo_evento\"]':\n        value: festa_infantil\nvalor_max_fotografia:\n  '#type': number\n  '#title': 'Valor Máximo para Investir em Fotografia'\n  '#placeholder': '00,00'\nobservacoes:\n  '#type': textarea\n  '#title': Observações\n  '#description': 'Informe nesse campo outros detalhes que considere relevante sobre o evento!'\n  '#title_display': invisible\n  '#placeholder': Observações\nactions:\n  '#type': webform_actions\n  '#title': 'Submit button(s)'\n  '#submit__label': Enviar\n  '#submit__attributes':\n    class:\n      - 'btn btn-primary button button--primary js-form-submit form-submit'"
