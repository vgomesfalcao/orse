---
- name: Ensure deploy user exists
  ansible.builtin.user:
    name: "{{ drupal_app_user }}"
    shell: /bin/bash
    create_home: true
    groups: "{{ drupal_app_group }}"
    append: true

- name: Ensure Drupal directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drupal_app_user }}"
    group: "{{ drupal_app_group }}"
    mode: "{{ drupal_app_mode }}"
  loop: "{{ drupal_shared_dirs }}"

- name: Check for Drupal settings.php
  ansible.builtin.stat:
    path: "{{ deployment_root }}/web/sites/default/settings.php"
  register: drupal_settings_stat

- name: Ensure sites/default/settings.php permissions
  ansible.builtin.file:
    path: "{{ deployment_root }}/web/sites/default/settings.php"
    owner: "{{ drupal_app_user }}"
    group: "{{ drupal_app_group }}"
    mode: '0664'
  when: drupal_settings_stat.stat.exists

- name: Deploy settings.local.php with database configuration
  ansible.builtin.template:
    src: settings.local.php.j2
    dest: "{{ deployment_root }}/web/sites/default/settings.local.php"
    owner: "{{ drupal_app_user }}"
    group: "{{ drupal_app_group }}"
    mode: '0644'

- name: Ensure settings.php includes settings.local.php
  ansible.builtin.lineinfile:
    path: "{{ deployment_root }}/web/sites/default/settings.php"
    line: "if (file_exists($app_root . '/' . $site_path . '/settings.local.php')) { include $app_root . '/' . $site_path . '/settings.local.php'; }"
    create: false
    insertafter: EOF
  when: drupal_settings_stat.stat.exists
