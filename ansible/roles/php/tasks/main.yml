---
- name: Install PHP packages
  ansible.builtin.apt:
    name: "{{ php_packages }}"
    state: present
    update_cache: true

- name: Configure PHP CLI settings
  ansible.builtin.lineinfile:
    path: "{{ php_ini_cli_path }}"
    regexp: '^{{ item.key }} ='
    line: "{{ item.key }} = {{ item.value }}"
    backrefs: false
  loop:
    - { key: memory_limit, value: "{{ php_memory_limit }}" }
    - { key: upload_max_filesize, value: "{{ php_upload_limit }}" }
    - { key: post_max_size, value: "{{ php_post_max_size }}" }
    - { key: max_execution_time, value: "{{ php_max_execution_time }}" }
    - { key: date.timezone, value: "{{ php_timezone }}" }
  notify: restart php-fpm

- name: Configure PHP FPM settings
  ansible.builtin.lineinfile:
    path: "{{ php_ini_fpm_path }}"
    regexp: '^{{ item.key }} ='
    line: "{{ item.key }} = {{ item.value }}"
    backrefs: false
  loop:
    - { key: memory_limit, value: "{{ php_memory_limit }}" }
    - { key: upload_max_filesize, value: "{{ php_upload_limit }}" }
    - { key: post_max_size, value: "{{ php_post_max_size }}" }
    - { key: max_execution_time, value: "{{ php_max_execution_time }}" }
    - { key: date.timezone, value: "{{ php_timezone }}" }
  notify: restart php-fpm

- name: Ensure PHP-FPM service is running
  ansible.builtin.systemd:
    name: "{{ php_fpm_service }}"
    state: started
    enabled: true
