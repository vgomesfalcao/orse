name: Drupal Deploy Prod

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - uses: actions/checkout@v3

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Prepare SSH key for deployment
      run: |
        mkdir -p ~/.ssh
        printf '%s' "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

    - name: Add remote host to known_hosts
      run: ssh-keyscan -p 22 204.216.172.21 >> ~/.ssh/known_hosts

    - name: Install Ansible
      run: sudo apt-get update && sudo apt-get install -y ansible

    - name: rsync deployments
      env:
        RSYNC_RSH: "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
      run: |
        rsync -avzr --delete \
          --exclude 'web/sites/default/files' \
          --exclude 'web/sites/default/settings.local.php' \
          --exclude 'web/mkt' \
          ./ deploy@204.216.172.21:/var/www/orse/orse_d/

    - name: Run Ansible post-deploy tasks
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"
        ANSIBLE_CONFIG: ansible.cfg
        DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
      run: |
        if [ -z "$DEPLOY_SUDO_PASSWORD" ]; then
          echo "Missing secret DEPLOY_SUDO_PASSWORD" >&2
          exit 1
        fi
        ansible-playbook -i ansible/inventory/production.yml ansible/playbooks/post_deploy.yml --private-key ~/.ssh/deploy_key
