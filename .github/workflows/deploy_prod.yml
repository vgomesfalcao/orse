name: Drupal Deploy Prod

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - uses: actions/checkout@v3

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Prepare SSH key for deployment
      run: |
        mkdir -p ~/.ssh
        cat <<'EOF' > ~/.ssh/deploy_key
        ${{ secrets.DEPLOY_KEY }}
        EOF
        sed -i 's/\r$//' ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

    - name: Install Ansible
      run: sudo apt-get update && sudo apt-get install -y ansible

    - name: Get deployment configuration from inventory
      id: deploy_config
      run: |
        REMOTE_HOST=$(ansible-inventory -i ansible/inventory/production.yml --host drupal_prod | jq -r '.ansible_host')
        REMOTE_USER=$(ansible-inventory -i ansible/inventory/production.yml --host drupal_prod | jq -r '.ansible_user')
        REMOTE_PATH=$(ansible-inventory -i ansible/inventory/production.yml --host drupal_prod | jq -r '.deployment_root')
        echo "remote_host=${REMOTE_HOST}" >> $GITHUB_OUTPUT
        echo "remote_user=${REMOTE_USER}" >> $GITHUB_OUTPUT
        echo "remote_path=${REMOTE_PATH}" >> $GITHUB_OUTPUT

    - name: rsync deployments
      uses: burnett01/rsync-deployments@5.2.1
      with:
        switches: -avzr --delete --exclude 'web/sites/default/files' --exclude 'web/sites/default/settings.local.php' --exclude 'web/mkt'
        path: ./
        remote_path: ${{ steps.deploy_config.outputs.remote_path }}/
        remote_host: ${{ steps.deploy_config.outputs.remote_host }}
        remote_port: 22
        remote_user: ${{ steps.deploy_config.outputs.remote_user }}
        remote_key: ${{ secrets.DEPLOY_KEY }}

    - name: Run Ansible post-deploy tasks
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"
        ANSIBLE_CONFIG: ansible.cfg
        DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
      run: |
        if [ -z "$DEPLOY_SUDO_PASSWORD" ]; then
          echo "Missing secret DEPLOY_SUDO_PASSWORD" >&2
          exit 1
        fi
        ansible-playbook -i ansible/inventory/production.yml ansible/playbooks/post_deploy.yml --private-key ~/.ssh/deploy_key
