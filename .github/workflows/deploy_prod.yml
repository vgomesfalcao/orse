name: Drupal Deploy Prod

on:
  push:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - uses: actions/checkout@v3

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare SSH key for deployment
        run: |
          mkdir -p ~/.ssh
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.DEPLOY_KEY }}
          EOF
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Create dummy vault file for CI/CD
        run: |
          mkdir -p ansible/inventory/group_vars/all
          echo "---" > ansible/inventory/group_vars/all/vault.yml
          echo "ansible_become_password_vault: ''" >> ansible/inventory/group_vars/all/vault.yml

      - name: Run Ansible pre-deploy tasks (fix permissions)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: ansible.cfg
          DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
          DEPLOY_USER: ${{ vars.USERNAME }}
          DEPLOY_HOST: ${{ vars.HOSTNAME }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_SUDO_PASSWORD" ]; then
            echo "Missing secret DEPLOY_SUDO_PASSWORD" >&2
            exit 1
          fi
          ansible-playbook -i ansible/inventory/production.yml ansible/playbooks/pre_deploy.yml --private-key ~/.ssh/deploy_key \
            -e "deploy_user=$DEPLOY_USER deploy_host=$DEPLOY_HOST deploy_path=$DEPLOY_PATH"

      - name: rsync deployments
        uses: burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr --delete --exclude 'web/sites/default/files' --exclude 'web/sites/default/settings.local.php' --exclude 'web/mkt'
          path: ./
          remote_path: ${{ vars.DEPLOY_PATH }}/
          remote_host: ${{ vars.HOSTNAME }}
          remote_port: 22
          remote_user: ${{ vars.USERNAME }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Run Ansible post-deploy tasks
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: ansible.cfg
          DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
          DEPLOY_USER: ${{ vars.USERNAME }}
          DEPLOY_HOST: ${{ vars.HOSTNAME }}
          DEPLOY_PATH: /var/www/orse/orse_d
        run: |
          if [ -z "$DEPLOY_SUDO_PASSWORD" ]; then
            echo "Missing secret DEPLOY_SUDO_PASSWORD" >&2
            exit 1
          fi
          ansible-playbook -i ansible/inventory/production.yml ansible/playbooks/post_deploy.yml --private-key ~/.ssh/deploy_key \
            -e "deploy_user=$DEPLOY_USER deploy_host=$DEPLOY_HOST deploy_path=$DEPLOY_PATH"
