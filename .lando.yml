name: orsed
recipe: drupal9

config:
  php: 7.4
  webroot: web
  xdebug: true
  database: mysql
services:
  appserver:
    build:
      - composer install
    overrides:
      environment:
        DRUSH_OPTIONS_URI: "https://orsed.lndo.site"
  node:
    type: node
    build:
      - npm install
tooling:
  node:
    service: appserver
  npm:
    service: appserver
